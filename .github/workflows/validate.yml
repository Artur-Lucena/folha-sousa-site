name: Validar site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar lint
        run: pnpm lint

      - name: Compilar
        run: pnpm build

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Testes unitários (agendamento, WhatsApp, webhook, dados do site)
        run: pnpm test

      - name: Instalar navegador dos testes E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E e acessibilidade (desktop e celular)
        run: pnpm e2e

      - name: Lighthouse (acessibilidade e SEO bloqueiam; desempenho avisa)
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Guardar relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            playwright-report/
            test-results/
            .lighthouseci/relatorios/
          if-no-files-found: ignore
          retention-days: 14
